[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "php artisan migrate --force && nginx -g 'daemon off;'"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "doclang-boba"
port = 80

[[services.envs]]
key = "APP_ENV"
value = "production"

[[services.envs]]
key = "APP_DEBUG"
value = "false"

[[services.envs]]
key = "LOG_LEVEL"
value = "error"
