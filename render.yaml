services:
  # ============================================
  # Laravel Web Service
  # ============================================
  - type: web
    name: doclang-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: doclang-app
          type: web
          property: url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: doclang-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: doclang-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: doclang-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: doclang-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: doclang-db
          property: password
      - key: WA_GATEWAY_URL
        fromService:
          name: doclang-wa
          type: web
          property: url
          concat: /api/send-message
      - key: WA_GATEWAY_STATUS_URL
        fromService:
          name: doclang-wa
          type: web
          property: url
          concat: /api/admin/status
      - key: WA_GATEWAY_QR_URL
        fromService:
          name: doclang-wa
          type: web
          property: url
          concat: /api/admin/qr
      - key: WA_GATEWAY_PAIRING_CODE_URL
        fromService:
          name: doclang-wa
          type: web
          property: url
          concat: /api/admin/pairing-code
      - key: WA_GATEWAY_RECONNECT_URL
        fromService:
          name: doclang-wa
          type: web
          property: url
          concat: /api/admin/reconnect
      - key: WA_GATEWAY_TOKEN
        generateValue: true
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_LEVEL
        value: error

  # ============================================
  # Queue Worker (Background)
  # ============================================
  - type: worker
    name: doclang-queue
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    startCommand: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          name: doclang-app
          type: web
          property: envKey.APP_KEY
      - key: APP_URL
        fromService:
          name: doclang-app
          type: web
          property: url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: doclang-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: doclang-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: doclang-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: doclang-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: doclang-db
          property: password
      - key: WA_GATEWAY_URL
        fromService:
          name: doclang-wa
          type: web
          property: url
          concat: /api/send-message
      - key: WA_GATEWAY_TOKEN
        fromService:
          name: doclang-app
          type: web
          property: envKey.WA_GATEWAY_TOKEN
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database

  # ============================================
  # WhatsApp Gateway (Node.js + Chromium)
  # ============================================
  - type: web
    name: doclang-wa
    runtime: docker
    rootDir: whatsapp-gateway
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WA_GATEWAY_TOKEN
        fromService:
          name: doclang-app
          type: web
          property: envKey.WA_GATEWAY_TOKEN
      - key: CHROME_PATH
        value: /usr/bin/chromium

# ============================================
# PostgreSQL Database
# ============================================
databases:
  - name: doclang-db
    plan: free
    databaseName: doclang
    user: doclang
